[package]
name = "mimic-jmp"
version = "0.1.0"
description = "Tauri 2 desktop shell for mimic-JMP (DOE + quality engineering analysis tool)"
authors = ["mimic-JMP contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "AGPL-3.0-or-later"
default-run = "mimic-jmp"

[lib]
name = "mimic_jmp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mimic-jmp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# 默认不启用额外插件；Phase 1 需要文件对话框 / 文件系统时再按需加 tauri-plugin-*。
default = []

[profile.release]
# 桌面分发体积优先；需要更快 WASM 宿主时再调回。
opt-level = "s"
lto = true
codegen-units = 1
